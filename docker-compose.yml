# Local Neo4j 5.26 (LTS) + Graph Data Science plugin.
# Neo4j's official matrix pairs Neo4j 5.26 with GDS 2.13; the NEO4J_PLUGINS
# mechanism downloads the matching GDS jar on first start (needs internet once).
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: gelm-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt protocol (used by Python driver)
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
      NEO4J_db_transaction_timeout: "60s"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
